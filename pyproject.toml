[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "yieldlens-ai"
version = "0.1.0"
description = "Evidence-Grounded Market Commentary Engine for US Rates & Fed Policy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # ── Database ──────────────────────────────────────────────────────────────
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",

    # ── Data ingestion ────────────────────────────────────────────────────────
    "fredapi>=0.5.1",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "feedparser>=6.0.11",

    # ── NLP / ML ──────────────────────────────────────────────────────────────
    "torch>=2.3.0",
    "transformers>=4.42.0",
    "sentence-transformers>=3.0.0",
    "peft>=0.11.0",
    "datasets>=2.20.0",
    "tokenizers>=0.19.0",
    "spacy>=3.7.4",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # ── Retrieval / orchestration ─────────────────────────────────────────────
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "openai>=1.35.0",
    "rank-bm25>=0.2.2",

    # ── API ───────────────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",

    # ── Experiment tracking ───────────────────────────────────────────────────
    "mlflow>=2.14.0",

    # ── Scheduling ────────────────────────────────────────────────────────────
    "apscheduler>=3.10.4",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "python-dotenv>=1.0.1",
    "tenacity>=8.4.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "loguru>=0.7.2",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
yieldlens = "api.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "processing*", "retrieval*", "generation*", "verification*", "evaluation*", "models*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

